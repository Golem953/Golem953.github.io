<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appareil photo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .card {
      background: #1a1a1a;
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
      stroke: #fff;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); opacity: 0.85; }

    .btn-primary {
      background: #fff;
      color: #000;
      margin-bottom: 12px;
    }

    .btn-secondary {
      background: transparent;
      color: rgba(255,255,255,0.6);
      border: 0.5px solid rgba(255,255,255,0.15);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Preview section */
    #preview-section {
      display: none;
      margin-top: 1.5rem;
    }

    #preview-section.visible { display: block; }

    #preview-section h2 {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      margin-bottom: 12px;
    }

    #photo-preview {
      width: 100%;
      border-radius: 12px;
      border: 0.5px solid rgba(255,255,255,0.1);
      display: block;
    }

    .success-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(30,200,100,0.15);
      color: #1ec864;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .success-badge svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Hidden file input */
    #file-input { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </div>

    <h1>Accès à l'appareil photo</h1>
    <p>Cette page souhaite accéder à votre appareil photo pour prendre une photo directement depuis le navigateur.</p>

    <button class="btn btn-primary" onclick="openCamera()">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Prendre une photo
    </button>

    <button class="btn btn-secondary" onclick="openGallery()">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      Choisir depuis la galerie
    </button>

    <!-- Preview après photo -->
    <div id="preview-section">
      <div class="success-badge">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Photo capturée
      </div>
      <h2>Aperçu</h2>
      <img id="photo-preview" alt="Photo prise" />
    </div>
  </div>

  <!-- Input caméra (capture=camera) -->
  <input type="file" id="file-input" accept="image/*" />

  <script>
    const fileInput = document.getElementById('file-input');
    const previewSection = document.getElementById('preview-section');
    const photoPreview = document.getElementById('photo-preview');

    function openCamera() {
      fileInput.setAttribute('capture', 'environment');
      fileInput.click();
    }

    function openGallery() {
      fileInput.removeAttribute('capture');
      fileInput.click();
    }

    fileInput.addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      photoPreview.src = url;
      previewSection.classList.add('visible');
      photoPreview.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  </script>

</body>
</html>
